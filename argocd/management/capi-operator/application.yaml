apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/cluster-api-operator
      chart: cluster-api-operator
      targetRevision: 0.28.0
      helm:
        releaseName: capi-operator
        valueFiles:
          - $values/argocd/management/capi-operator/values.yaml
    - repoURL: https://github.com/daigo-suhara/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: capi-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
