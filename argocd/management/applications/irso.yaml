apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: irso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/daigo-suhara/homelab.git
    targetRevision: HEAD
    path: argocd/management/manifests/metal3/irso
  destination:
    server: https://kubernetes.default.svc
    namespace: ironic-standalone-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
