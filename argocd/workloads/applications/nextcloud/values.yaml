replicaCount: 0
nextcloud:
  host: nextcloud.pochizo.com
  trustedDomains: [nextcloud.pochizo.com]
  hooks:
    before-starting: |-
      #!/bin/sh
      set -eu
      if php /var/www/html/occ status --output=json | grep -q '"installed":false'; then
        php /var/www/html/occ maintenance:install --database=mysql --database-host="$MYSQL_HOST" --database-name="$MYSQL_DATABASE" --database-user="$MYSQL_USER" --database-pass="$MYSQL_PASSWORD" --admin-user="$NEXTCLOUD_ADMIN_USER" --admin-pass="$NEXTCLOUD_ADMIN_PASSWORD"
      fi
  extraEnv:
    - name: OVERWRITEHOST
      value: nextcloud.pochizo.com
    - name: OVERWRITEPROTOCOL
      value: https
    - name: OVERWRITECLIURL
      value: https://nextcloud.pochizo.com
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: username
    passwordKey: password
service:
  type: ClusterIP
internalDatabase:
  enabled: false
externalDatabase:
  existingSecret:
    enabled: true
    secretName: nextcloud-mariadb
    usernameKey: username
    passwordKey: mariadb-password
mariadb:
  enabled: false
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-mariadb
  primary:
    persistence:
      enabled: true
      storageClass: general
      size: 10Gi
persistence:
  enabled: true
  storageClass: general
  size: 100Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
cronjob:
  enabled: true
  type: sidecar
startupProbe:
  enabled: true
  periodSeconds: 10
  failureThreshold: 120
