apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  sources:
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.4.1
      helm:
        releaseName: nextcloud
        valueFiles:
          - $values/argocd/workloads/applications/nextcloud/values.yaml
    - repoURL: https://github.com/daigo-suhara/homelab.git
      targetRevision: HEAD
      ref: values
      path: argocd/workloads/applications/nextcloud
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: -1
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
