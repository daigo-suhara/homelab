apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image:
    tag: 2026.10.7-slim
  config:
    mergeMode: merge
  storage:
    persistence:
      storageClass: general
  initContainers:
    - name: fix-data-owner
      image: docker.io/library/busybox:1.37
      command:
        - sh
        - -ec
        - |
          umask 077
          mkdir -p /data/.update-captures
          chown -R 1000:1000 /data
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE]
      volumeMounts:
        - name: data
          mountPath: /data
  extraVolumeMounts:
    - name: data
      mountPath: /home/openclaw/.openclaw.update-captures
      subPath: .update-captures
