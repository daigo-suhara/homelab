apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image:
    tag: 2026.10.7-slim
  config:
    mergeMode: merge
  probes:
    startup:
      # Doctor and database maintenance exceeded the default five-minute window.
      failureThreshold: 180
  storage:
    persistence:
      storageClass: general
