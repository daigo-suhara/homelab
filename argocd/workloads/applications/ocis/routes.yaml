apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ocis-http-redirect
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: http
  hostnames: [ocis.pochizo.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ocis
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https-ocis-pochizo-com
  hostnames: [ocis.pochizo.com]
  rules:
    - backendRefs:
        - name: ocis
          port: 9200
