apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: ghcr.io/helmforgedev/helm
    chart: wordpress
    targetRevision: 3.0.6
    helm:
      releaseName: wordpress
      valuesObject:
        fullnameOverride: wordpress
        replicaCount: 2
        wordpress:
          siteUrl: https://www.pochizo.com
          siteTitle: pochizo.com
          adminEmail: suharadaigo@gmail.com
          disableWpCron: true
        bootstrap:
          enabled: false
        mysql:
          architecture: standalone
          standalone:
            persistence:
              storageClass: general
              size: 10Gi
        persistence:
          storageClass: cephfs
          accessMode: ReadWriteMany
          size: 10Gi
        plugins:
          enabled: true
          installer:
            enabled: true
        objectCache:
          enabled: true
          provider: redis
          redis:
            mode: subchart
            subchart:
              enabled: true
        redis:
          standalone:
            persistence:
              enabled: false
        wpCron:
          cronJob:
            enabled: true
        backup:
          enabled: false
        php:
          ini: |
            upload_max_filesize = 64M
            post_max_size = 72M
        gatewayAPI:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress
  ignoreDifferences:
    # The chart generates credentials when Helm cannot query the cluster.
    # Keep the initially created values stable across Argo CD reconciliations.
    - group: ""
      kind: Secret
      name: wordpress-admin
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wordpress-database
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wordpress-mysql-auth
      jsonPointers: [/data]
    - group: ""
      kind: Secret
      name: wordpress-redis-auth
      jsonPointers: [/data]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
