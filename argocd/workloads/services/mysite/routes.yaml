# Application-owned routes attach to the platform-owned public Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite-http-redirect
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: http
  hostnames: [daigo-suhara.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https-daigo-suhara-com
  hostnames: [daigo-suhara.com]
  rules:
    - backendRefs:
        - name: mysite
          port: 80
