apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite-daigo-suhara-redirect
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: http
    - name: public
      namespace: gateway-system
      sectionName: https-daigo-suhara-com
  hostnames: [daigo-suhara.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: www.pochizo.com
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite-http-redirect
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: http
  hostnames: [www.pochizo.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite-apex-redirect
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: http
    - name: public
      namespace: gateway-system
      sectionName: https-pochizo-com
  hostnames: [pochizo.com]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: www.pochizo.com
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mysite
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https-www-pochizo-com
  hostnames: [www.pochizo.com]
  rules:
    - backendRefs:
        - name: mysite
          port: 80
