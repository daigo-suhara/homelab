apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Service
      name: mysite
      jsonPointers: [/spec/selector/rollouts-pod-template-hash]
    - group: ""
      kind: Service
      name: mysite-preview
      jsonPointers: [/spec/selector/rollouts-pod-template-hash]
  source:
    repoURL: https://github.com/daigo-suhara/homelab.git
    targetRevision: HEAD
    path: argocd/workloads/services/mysite
  destination:
    server: https://kubernetes.default.svc
    namespace: mysite
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mysite
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: mysite
      images:
        - alias: mysite
          imageName: ghcr.io/daigo-suhara/mysite:latest
          commonUpdateSettings:
            updateStrategy: digest
