---
- name: Bootstrap the management cluster
  hosts: management
  become: true

  vars:
    argocd_chart_version: 10.1.4

  tasks:
    - name: Install MicroK8s
      ansible.builtin.command:
        cmd: snap install microk8s --classic
        creates: /snap/bin/microk8s

    - name: Wait for MicroK8s
      ansible.builtin.command: microk8s status --wait-ready --timeout 300
      changed_when: false

    - name: Enable MicroK8s addons
      ansible.builtin.command: microk8s enable {{ item }}
      register: addon_enable
      loop:
        - dns
        - hostpath-storage
        - rbac
        - helm3
      changed_when: "'already enabled' not in addon_enable.stdout"

    - name: Read the Argo CD release
      ansible.builtin.command: microk8s helm3 status argocd --namespace argocd --output json
      register: argocd_release
      changed_when: false
      failed_when: argocd_release.rc not in [0, 1]

    - name: Install Argo CD
      ansible.builtin.command: >-
        microk8s helm3 upgrade --install argocd argo-cd
        --repo https://argoproj.github.io/argo-helm
        --namespace argocd --create-namespace
        --version {{ argocd_chart_version }} --wait --timeout 10m
      when: argocd_release.rc != 0 or argocd_chart_version not in argocd_release.stdout
      changed_when: true

    - name: Apply the management App-of-Apps
      ansible.builtin.command:
        cmd: microk8s kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../argocd/bootstrap/app-of-apps.yaml') }}"
      register: app_of_apps
      changed_when: "'created' in app_of_apps.stdout or 'configured' in app_of_apps.stdout"
