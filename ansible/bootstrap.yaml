---
- name: Bootstrap the management cluster
  hosts: management
  become: true

  tasks:
    - name: Install MicroK8s
      ansible.builtin.command:
        cmd: snap install microk8s --classic
        creates: /snap/bin/microk8s

    - name: Check the MicroK8s API server kicker
      ansible.builtin.command: snap services microk8s.daemon-apiserver-kicker
      register: apiserver_kicker
      changed_when: false

    - name: Disable the MicroK8s API server kicker
      ansible.builtin.command: snap stop --disable microk8s.daemon-apiserver-kicker
      when: "'disabled' not in apiserver_kicker.stdout"
      changed_when: true

    - name: Enable MicroK8s addons
      ansible.builtin.command: microk8s enable {{ item }}
      register: addon_enable
      loop:
        - community
        - dns
        - rook-ceph
        - rbac
        - helm3
        - argocd
      changed_when: "'already enabled' not in addon_enable.stdout"

    - name: Apply the management App-of-Apps
      ansible.builtin.command:
        cmd: microk8s kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../argocd/bootstrap/app-of-apps.yaml') }}"
      register: app_of_apps
      changed_when: "'created' in app_of_apps.stdout or 'configured' in app_of_apps.stdout"
