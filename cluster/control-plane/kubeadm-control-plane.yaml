apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: homelab-control-plane
  namespace: metal3
spec:
  replicas: 3
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: homelab-control-plane
  version: v1.36.2
  kubeadmConfigSpec:
    format: ignition
    clusterConfiguration:
      apiServer:
        certSANs: [172.16.10.100, 127.0.0.1]
    initConfiguration:
      nodeRegistration:
        criSocket: unix:///var/run/crio/crio.sock
        taints: []
        kubeletExtraArgs:
          - name: node-labels
            value: "ceph-mon=enabled,ceph-mgr=enabled,ceph-osd=enabled,ceph-mds=enabled"
    joinConfiguration:
      controlPlane: {}
      nodeRegistration:
        criSocket: unix:///var/run/crio/crio.sock
        taints: []
        kubeletExtraArgs:
          - name: node-labels
            value: "ceph-mon=enabled,ceph-mgr=enabled,ceph-osd=enabled,ceph-mds=enabled"
    preKubeadmCommands:
      - until getent hosts extensions.flatcar.org >/dev/null 2>&1; do sleep 5; done
      - mkdir -p /opt/extensions/kubernetes /opt/extensions/crio /etc/extensions /etc/sysupdate.kubernetes.d /etc/sysupdate.crio.d /etc/sysupdate.d
      - curl -fL --retry 10 --retry-delay 5 -o /etc/sysupdate.kubernetes.d/kubernetes-v1.36.conf https://extensions.flatcar.org/extensions/kubernetes/kubernetes-v1.36.conf
      - curl -fL --retry 10 --retry-delay 5 -o /etc/sysupdate.crio.d/crio.conf https://extensions.flatcar.org/extensions/crio/crio.conf
      - curl -fL --retry 10 --retry-delay 5 -o /etc/sysupdate.d/noop.conf https://extensions.flatcar.org/extensions/noop.conf
      - curl -fL --retry 10 --retry-delay 5 -o /opt/extensions/kubernetes/kubernetes-v1.36.2-x86-64.raw https://extensions.flatcar.org/extensions/kubernetes/kubernetes-v1.36.2-x86-64.raw
      - curl -fL --retry 10 --retry-delay 5 -o /opt/extensions/crio/crio-v1.36.2-x86-64.raw https://extensions.flatcar.org/extensions/crio/crio-v1.36.2-x86-64.raw
      - ln -sf /opt/extensions/kubernetes/kubernetes-v1.36.2-x86-64.raw /etc/extensions/kubernetes.raw
      - ln -sf /opt/extensions/crio/crio-v1.36.2-x86-64.raw /etc/extensions/crio.raw
      - ln -sf /dev/null /etc/extensions/containerd-flatcar.raw
      - systemd-sysext refresh || systemd-sysext merge
      - systemctl daemon-reload
      - systemctl enable --now crio.service
      - systemctl enable kubelet.service
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        permissions: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata: { name: kube-vip, namespace: kube-system }
          spec:
            hostNetwork: true
            hostAliases:
              - ip: 127.0.0.1
                hostnames: [kubernetes]
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:v1.2.1
                args: [manager]
                env:
                  - { name: vip_interface,     value: eno1 }
                  - { name: address,           value: "172.16.10.100" }
                  - { name: cp_enable,         value: "true" }
                  - { name: vip_arp,           value: "true" }
                  - { name: vip_leaderelection,value: "true" }
                  - { name: vip_leasename,     value: plndr-cp-lock }
                  - { name: vip_leaseduration, value: "5" }
                  - { name: vip_renewdeadline, value: "3" }
                  - { name: vip_retryperiod,   value: "1" }
                securityContext:
                  capabilities: { add: [NET_ADMIN, NET_RAW] }
                volumeMounts:
                  - { name: kubeconfig, mountPath: /etc/kubernetes/admin.conf, readOnly: true }
            volumes:
              - name: kubeconfig
                hostPath: { path: /etc/kubernetes/admin.conf, type: File }
