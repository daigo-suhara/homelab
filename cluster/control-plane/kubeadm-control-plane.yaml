apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: homelab-control-plane
  namespace: metal3
spec:
  replicas: 3
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: homelab-control-plane
  version: v1.37.0
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs: [172.16.10.100, 127.0.0.1]
    initConfiguration:
      nodeRegistration:
        taints: []
        kubeletExtraArgs:
          - name: node-labels
            value: "metal3.io/uuid={{ ds.meta_data.uuid }},ceph-mon=enabled,ceph-mgr=enabled,ceph-osd=enabled,ceph-mds=enabled"
    joinConfiguration:
      controlPlane: {}
      nodeRegistration:
        taints: []
        kubeletExtraArgs:
          - name: node-labels
            value: "metal3.io/uuid={{ ds.meta_data.uuid }},ceph-mon=enabled,ceph-mgr=enabled,ceph-osd=enabled,ceph-mds=enabled"
    preKubeadmCommands:
      - apt-get update
      - apt-get install -y ca-certificates curl gpg
      - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
      - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
      - curl -fsSL https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/cri-o.gpg
      - echo 'deb [signed-by=/etc/apt/keyrings/cri-o.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/deb/ /' > /etc/apt/sources.list.d/cri-o.list
      - apt-get update
      - apt-get install -y cri-o kubelet kubeadm
      - systemctl enable --now crio
      - systemctl enable kubelet
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        permissions: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata: { name: kube-vip, namespace: kube-system }
          spec:
            hostNetwork: true
            hostAliases:
              - ip: 127.0.0.1
                hostnames: [kubernetes]
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:v1.2.1
                args: [manager]
                env:
                  - { name: vip_interface,     value: eno1 }
                  - { name: address,           value: "172.16.10.100" }
                  - { name: cp_enable,         value: "true" }
                  - { name: vip_arp,           value: "true" }
                  - { name: vip_leaderelection,value: "true" }
                  - { name: vip_leasename,     value: plndr-cp-lock }
                  - { name: vip_leaseduration, value: "5" }
                  - { name: vip_renewdeadline, value: "3" }
                  - { name: vip_retryperiod,   value: "1" }
                securityContext:
                  capabilities: { add: [NET_ADMIN, NET_RAW] }
                volumeMounts:
                  - { name: kubeconfig, mountPath: /etc/kubernetes/admin.conf, readOnly: true }
            volumes:
              - name: kubeconfig
                hostPath: { path: /etc/kubernetes/admin.conf, type: File }
